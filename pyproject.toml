[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-eval"
version = "0.1.0"
description = "Controlled-experiment evaluation system for Agent frameworks (Claude Code, Codex, skills, prompts, hooks)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cc-eval contributors" }]
keywords = ["evaluation", "agent", "experiment", "benchmark", "llm"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
judge = [
  "anthropic>=0.40",
]
mlflow = [
  "mlflow>=2.16",
]

[project.scripts]
cc-eval = "cc_eval.cli.main:app"

[project.urls]
Homepage = "https://github.com/example/cc-eval"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cc_eval = ["py.typed", "resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:cc_eval.*"]
markers = [
  "slow: tests that spawn real agent runtimes (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
