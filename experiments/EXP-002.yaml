id: EXP-002
title: 单变量实验 —— 确定性与并发检测器
hypothesis: >
  在规格评审技能中加入确定性检测与状态一致性检测，可以提高缺陷密集规格上的缺陷召回率，
  同时不会在干净规格上引入误报。
independent_variable: >
  仅一个文件：框架目录中的 skills/spec_review.py。两棵目录之间没有其他差异，
  因此这是一个严格的单变量对比。
baseline:
  name: baseline
  framework:
    type: path
    path: examples/framework/baseline
  config: {}
  expected_capabilities:
    - spec-review
    - intent-router
    - cross-module-impact
    - requirement-guard
candidate:
  name: candidate
  framework:
    type: path
    path: examples/framework/spec-review-only
  config: {}
  expected_capabilities:
    - spec-review
    - intent-router
    - cross-module-impact
    - requirement-guard
controls:
  runtime: fake
  model: null
  benchmark: benchmarks/suite
  dataset_version: v1
  evaluator: deterministic-v1
  repetitions: 3
  max_budget_usd: null
  timeout_sec: 300
  seed: 20240101
  order: alternating
metrics:
  - recall
  - precision
  - false_positive_count
expected_changes:
  - skills/spec_review.py
decision_rules:
  primary_metric: recall
  direction: higher_is_better
  min_delta: 0.05
  min_repetitions: 3
  case_delta_threshold: 0.0
  guard_metrics:
    - precision
  guard_tolerance: 0.0
  max_regressed_cases: 0
  require_confound_free: true
  require_verified_capabilities:
    - spec-review
  confidence:
    method: paired_bootstrap
    alpha: 0.05
    iterations: 2000
    seed: 20240101
framework_change: >
  Only skills/spec_review.py changed: two detectors were added.  The remaining
  three skills are byte-identical to the baseline.
references:
  - docs/adr/0002-single-variable-discipline.md
notes: >
  五个用例中只有一个可能改善，因此按用例配对的 bootstrap 置信区间较宽。
  这个实验诚实地展示了一个「有迹象但尚未获得统计支持」的结果：
  由于置信区间包含零，结论预计为「不确定」。
