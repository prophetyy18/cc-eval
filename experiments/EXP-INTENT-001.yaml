id: EXP-INTENT-001
title: intent 技能能否把一个客服请求拆成正确的意图？
hypothesis: >
  候选 intent 技能把一个包含三句话的客服请求拆解为它实际包含的两个用户问题
  （查找订单、订单状态无歧义），而不是每句话生成一个意图。
independent_variable: >
  .claude/skills/intent/SKILL.md 中 `intent` 技能的实现（以及它引用的参考文件）。
  两棵框架目录是同一仓库的两个提交，因此两者的差异正是被测试的改动本身。
baseline:
  name: baseline
  framework:
    type: git
    repository: /home/lpdev/cc-workflow
    ref: main
  config: {}
  expected_capabilities:
    - intent
candidate:
  name: candidate
  framework:
    type: git
    repository: /home/lpdev/cc-workflow
    # Put your branch here: the branch that carries the skill change.
    ref: feat/your-intent-change
  config: {}
  expected_capabilities:
    - intent
controls:
  runtime: claude
  # Pin the model.  It is a control: both sides must run on the same one.
  model: null
  benchmark: benchmarks/intent_skill
  dataset_version: v1
  evaluator: "rubric:intent-doc-v1"
  repetitions: 3
  max_budget_usd: 2.0
  timeout_sec: 600
  seed: 20240101
  order: alternating
metrics:
  - rubric_score
  - total_tokens
expected_changes:
  - ".claude/skills/intent/*"
decision_rules:
  primary_metric: rubric_score
  direction: higher_is_better
  min_delta: 0.05
  min_repetitions: 3
  case_delta_threshold: 0.0
  guard_metrics:
    - total_tokens
  guard_tolerance: 0.5
  max_regressed_cases: 0
  require_confound_free: true
  require_verified_capabilities:
    - intent
  confidence:
    method: paired_bootstrap
    alpha: 0.05
    iterations: 2000
    seed: 20240101
framework_change: >
  The change under test is a modification of the intent skill: how it decides
  that one user request contains several intents, and how it writes them
  down.
references:
  - docs/adr/0002-single-variable-discipline.md
notes: >
  intent 技能通常会向用户提问澄清。批量运行中没有人回答，因此用例要求 Agent
  就地标注自己的假设，评分标准会检查它是否照做。如果你的改动*正是*澄清这一步本身，
  这个评测框架无法衡量它 —— 两侧的交互都被移除了。
