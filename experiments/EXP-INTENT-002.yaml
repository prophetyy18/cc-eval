id: EXP-INTENT-002
title: 观察跑 —— intent 技能如何挖掘并澄清一个真实请求？
hypothesis: >
  intent 技能把 PHA 现货/期货价差套利请求转化为「一个」意图
  （两个方向是同一套利的两条路径，而不是两个目标），保留「PHA 数量不变」这一硬约束，
  并把决定这笔交易是否可行所依赖的未知项显式暴露出来。
independent_variable: >
  本次运行没有自变量 —— 两侧都是 cc-workflow 的同一个提交。此次运行的目的
  是「观察」intent 技能会产出什么、产出是否稳定；两侧之间的差异是 Agent 自身的
  逐次运行波动，在做任何改动之前值得先看清楚。
baseline:
  name: baseline
  framework:
    type: git
    repository: /home/lpdev/cc-workflow
    ref: main
  config: {}
  expected_capabilities:
    - intent
candidate:
  name: candidate
  framework:
    type: git
    repository: /home/lpdev/cc-workflow
    ref: main
  config: {}
  expected_capabilities:
    - intent
controls:
  runtime: claude
  model: null
  benchmark: benchmarks/intent_skill
  dataset_version: v1
  evaluator: "rubric:intent-doc-v1"
  repetitions: 1
  max_budget_usd: 3.0
  timeout_sec: 900
  seed: 20240101
  order: alternating
  runner_args:
    # The provider (base URL, token, model) lives in ~/.claude/settings.json,
    # so the user settings have to be loaded for the run to reach a model.
    setting_sources: "user,project"
metrics:
  - rubric_score
expected_changes: []
decision_rules:
  primary_metric: rubric_score
  direction: higher_is_better
  min_delta: 0.05
  min_repetitions: 1
  case_delta_threshold: 0.0
  max_regressed_cases: 0
  require_confound_free: true
  require_verified_capabilities:
    - intent
  confidence:
    method: paired_bootstrap
    alpha: 0.05
    iterations: 2000
    seed: 20240101
notes: >
  两侧故意使用同一个提交：这是一次观察跑，不是 A/B 对比。报告会把两份 INTENT.md
  文档并排展示，用来看清「什么都没改」时技能拆解的稳定性。
  混淆项分析会把两侧框架相同这件事标出来 —— 这是预期现象，不是本次运行的缺陷。
