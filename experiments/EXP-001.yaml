id: EXP-001
title: 面向评审、路由、影响分析与覆盖率的候选技能集
hypothesis: >
  候选技能集比基线技能集发现更多真实缺陷，同时不会在干净规格上引入误报。
independent_variable: >
  四个框架技能的实现。两棵框架目录之间恰好有四个文件不同，已列在 expected_changes 中。
baseline:
  name: baseline
  framework:
    type: path
    path: examples/framework/baseline
  config: {}
  expected_capabilities:
    - spec-review
    - intent-router
    - cross-module-impact
    - requirement-guard
candidate:
  name: candidate
  framework:
    type: path
    path: examples/framework/candidate
  config: {}
  expected_capabilities:
    - spec-review
    - intent-router
    - cross-module-impact
    - requirement-guard
controls:
  runtime: fake
  model: null
  benchmark: benchmarks/suite
  dataset_version: v1
  evaluator: deterministic-v1
  repetitions: 3
  max_budget_usd: null
  timeout_sec: 300
  seed: 20240101
  order: alternating
metrics:
  - recall
  - precision
  - f1
  - false_positive_count
expected_changes:
  - skills.manifest.json
  - skills/spec_review.py
  - skills/intent_router.py
  - skills/cross_module.py
  - skills/requirement_guard.py
decision_rules:
  primary_metric: recall
  direction: higher_is_better
  min_delta: 0.05
  min_repetitions: 3
  case_delta_threshold: 0.0
  guard_metrics:
    - precision
  guard_tolerance: 0.0
  max_regressed_cases: 0
  require_confound_free: true
  require_verified_capabilities:
    - spec-review
    - intent-router
    - cross-module-impact
    - requirement-guard
  confidence:
    method: paired_bootstrap
    alpha: 0.05
    iterations: 2000
    seed: 20240101
framework_change: >
  The candidate skill set adds the determinism and state-consistency detectors
  to the spec review, merges overlapping intents and adds the access-control
  intent category, follows the dependency graph transitively and only accepts
  a requirement as implemented when it is stated normatively.
references:
  - docs/adr/0002-single-variable-discipline.md
notes: >
  数据集是包含五个用例的核心套件。基线与候选使用同一个基准、同一个评估器、
  同样的执行顺序策略和同样的重复次数运行。
