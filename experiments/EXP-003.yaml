id: EXP-003
title: 过度敏感的性能检测器 —— 藏在更优平均值背后的退化
hypothesis: >
  在规格评审技能中加入性能检测器不会引入误报。
independent_variable: >
  规格评审技能的实现。候选目录与 EXP-001 相同的那四个文件存在差异，
  并且规格评审技能额外包含一个只要提到延迟就会触发的检测器。
baseline:
  name: baseline
  framework:
    type: path
    path: examples/framework/baseline
  config: {}
  expected_capabilities:
    - spec-review
    - intent-router
    - cross-module-impact
    - requirement-guard
candidate:
  name: candidate
  framework:
    type: path
    path: examples/framework/candidate_aggressive
  config: {}
  expected_capabilities:
    - spec-review
    - intent-router
    - cross-module-impact
    - requirement-guard
controls:
  runtime: fake
  model: null
  benchmark: benchmarks/suite
  dataset_version: v1
  evaluator: deterministic-v1
  repetitions: 3
  max_budget_usd: null
  timeout_sec: 300
  seed: 20240101
  order: alternating
metrics:
  - recall
  - precision
  - false_positive_count
expected_changes:
  - skills.manifest.json
  - skills/spec_review.py
  - skills/intent_router.py
  - skills/cross_module.py
  - skills/requirement_guard.py
decision_rules:
  primary_metric: recall
  direction: higher_is_better
  min_delta: 0.05
  min_repetitions: 3
  case_delta_threshold: 0.0
  # Precision is a guard metric: an average that improves while the reviewer
  # starts inventing defects is not an improvement.
  guard_metrics:
    - precision
  guard_tolerance: 0.0
  max_regressed_cases: 0
  require_confound_free: true
  require_verified_capabilities:
    - spec-review
  confidence:
    method: paired_bootstrap
    alpha: 0.05
    iterations: 2000
    seed: 20240101
framework_change: >
  The candidate skill set plus a performance detector that fires on any
  mention of latency, even when the specification states a measured latency
  budget.
notes: >
  预期结果是：召回率提升，同时在 SPEC-E002 上精确率退化，
  并且守护指标会把结论判为「不确定」而不是「改善」。
